    <!-- Intro animada en la primera visita de la sesión; animación de regreso al volver del proyecto.
         Se decide aquí, antes del primer pintado, y respeta "reducir movimiento". -->
    <script>try{var d=document.documentElement,ss=sessionStorage,n=performance.getEntriesByType&&performance.getEntriesByType('navigation')[0];if(!matchMedia('(prefers-reduced-motion: reduce)').matches){if(ss.getItem('growtale_return')||(n&&n.type==='back_forward'&&ss.getItem('growtale_intro'))){d.classList.add('return')}else if(!ss.getItem('growtale_intro')){d.classList.add('intro')}}ss.removeItem('growtale_return');ss.setItem('growtale_intro','1')}catch(e){}</script>
